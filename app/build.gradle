plugins { id 'com.android.application' }
android {
    namespace 'com.plannerroute.app'
    compileSdk 35
    defaultConfig { applicationId 'com.plannerroute.app'; minSdk 26; targetSdk 35; versionCode 11; versionName '0.1.10' }
